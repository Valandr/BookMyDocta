services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookmydocta}
      POSTGRES_USER: ${POSTGRES_USER:-bookmydocta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: backend-prod
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_NAME: bookmydocta-backend
      APP_VERSION: 1.0.0
      API_PREFIX: /api
      FRONTEND_ORIGIN: http://localhost:4173
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-bookmydocta}
      POSTGRES_USER: ${POSTGRES_USER:-bookmydocta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      LOG_LEVEL: info
    depends_on:
      - postgres
    ports:
      - '${BACKEND_PORT:-3000}:3000'

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: frontend-prod
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api
    depends_on:
      - backend
    ports:
      - '4173:4173'

volumes:
  postgres-data:
